[build]
  publish = "."
  # Static site, no build step. Set here so it overrides the dashboard's
  # "npm run build", which fails (there is no package.json).
  command = "echo 'Static site, no build step'"

# --- Canonical host: strip www ---
[[redirects]]
  from = "https://www.nexracreative.com/*"
  to = "https://nexracreative.com/:splat"
  status = 301
  force = true

# --- Keep internal docs out of the public site ---
# force = true is required: without it Netlify serves the real file,
# because a matching static asset wins over a redirect rule.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CREDITS.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# --- Canonical URLs: one address per page ---
# Netlify resolves /services to services.html as a static file, so these must be
# forced or the file wins and both URLs return 200 (duplicate content).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

